name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g., v0.6.4-html.3)'
        required: true

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-24.04
            artifact: dot-html-linux-x86_64
          - os: macos-14
            artifact: dot-html-darwin-arm64
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2

      - name: Build Release
        run: |
          zig build -Doptimize=ReleaseSmall
          strip zig-out/bin/dot-html || true
          mv zig-out/bin/dot-html ${{ matrix.artifact }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release assets
        run: |
          mkdir -p release
          mv artifacts/dot-html-linux-x86_64/dot-html-linux-x86_64 release/
          mv artifacts/dot-html-darwin-arm64/dot-html-darwin-arm64 release/
          chmod +x release/*
          ls -la release/

      - name: Get tag name
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: dots ${{ steps.tag.outputs.tag }}
          draft: false
          prerelease: false
          files: |
            release/dot-html-linux-x86_64
            release/dot-html-darwin-arm64
          body: |
            HTML-backed `dot-html` fork of [dots](https://github.com/joelreymont/dots).
            Stores dots as `.html` documents under `.dots/` and also reads legacy
            markdown (`.md`) dots.

            ## Installation

            ```bash
            # macOS ARM64
            curl -L -o dot-html https://github.com/${{ github.repository }}/releases/download/${{ steps.tag.outputs.tag }}/dot-html-darwin-arm64
            chmod +x dot-html && mv dot-html ~/.local/bin/

            # Linux x86_64
            curl -L -o dot-html https://github.com/${{ github.repository }}/releases/download/${{ steps.tag.outputs.tag }}/dot-html-linux-x86_64
            chmod +x dot-html && mv dot-html ~/.local/bin/
            ```

            ## Verify
            ```bash
            dot-html --version
            ```
